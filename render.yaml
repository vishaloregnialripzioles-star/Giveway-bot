services:
  - type: web
    name: air-commander-sparkxie-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: GUILD_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: air-commander-db
          property: connectionString
